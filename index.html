<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Misión FYQ 3.º ESO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0B1730;--p:#3685F5;--t:#20C7B5;--g:#34C78A;--o:#F3A847;--w:#F8FAFC;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,#16336b,var(--bg) 60%);color:var(--w);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:clamp(13px,1.35vw,19px);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:56px 1fr 56px}
.bar{display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.12)}
.bar.b{border-top:1px solid rgba(255,255,255,.12);border-bottom:0;justify-content:center}
.logo{font-weight:800;color:var(--t);letter-spacing:.5px;white-space:nowrap}.sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--p);color:#fff;font-weight:600}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.35;cursor:default}button:focus-visible,.fc:focus-visible{outline:3px solid var(--o)}
.g{background:var(--g);color:#052}.o{background:var(--o);color:#321}.n{background:rgba(255,255,255,.14)}
.tabs button{background:rgba(255,255,255,.1);border-radius:10px 10px 0 0}.tabs button.on{background:var(--t);color:#032}
main{min-height:0;padding:10px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.two{flex:1;min-height:0;display:flex;gap:10px}.pn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px;min-height:0;min-width:0;overflow:auto;backdrop-filter:blur(6px)}
h2{margin:0 0 6px;color:var(--t);font-size:1.35em}p{margin:4px 0;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fc{perspective:800px;height:150px;cursor:pointer}.fi{position:relative;width:100%;height:100%;transition:transform .65s;transform-style:preserve-3d}.fc.f .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:8px;overflow:auto;text-align:center;font-size:.9em}
.fa{background:linear-gradient(135deg,var(--p),var(--t));display:flex;flex-direction:column;align-items:center;justify-content:center}.fa b{font-size:2.6em}

.opt{display:block;width:100%;text-align:left;margin:4px 0;background:rgba(255,255,255,.12)}.opt.on{background:var(--p);outline:2px solid var(--w)}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid #567;background:#0d2145;color:var(--w);width:100%}
.fb1{padding:8px;border-radius:10px;margin-top:6px}.ok{background:rgba(52,199,138,.25);border:1px solid var(--g)}.ko{background:rgba(243,168,71,.25);border:1px solid var(--o)}.hn{background:rgba(54,133,245,.25)}
.home{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:0}.mc{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;cursor:pointer;transition:transform .2s}.mc:hover{transform:translateY(-4px);border-color:var(--t)}.mc span{font-size:2.2em}
table{border-collapse:collapse;width:100%}td,th{border:1px solid rgba(255,255,255,.25);padding:4px 6px}

.side button{display:block;width:100%;margin:4px 0}.big{font-size:1.4em;font-weight:700}svg text{font-family:system-ui,sans-serif}

.rm *{transition:none!important}
</style></head><body><div id="app"></div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>String(+(+x).toFixed(3)).replace('.',',');
const Q=(q,o,a,e,h,tag)=>({q,o,a,e,h:h||['Piensa qué propiedad o idea se pide.','Recuerda la teoría de la misión.','Descarta las opciones que no cumplen la definición.'],tag});
const MC=(q,c,w,e,h,tag,extra)=>{const o=sh([c,...w]);return Object.assign(Q(q,o,o.indexOf(c),e,h,tag),extra||{})};
const TF=(q,v,e,tag)=>Q(q,['Verdadero','Falso'],v?0:1,e,0,tag);
const MN=['Estado gaseoso y teoría cinética','Leyes de los gases','Ecuación de los gases ideales','Disoluciones','Concentración de una disolución','Problemas razonados','Gran desafío final'];
const MI=['🎈','📉','🧮','🧂','🧪','🧠','🏆'];
const CD={Presión:['Fuerza por unidad de superficie que ejerce el gas sobre las paredes. Unidades: Pa y atm.','Un neumático inflado.'],Volumen:['Espacio que ocupa el gas. Unidades: m³ y L.','El aire de una jeringa.'],Temperatura:['Relacionada con la agitación de las partículas. En las leyes, siempre en K: T(K) = t(°C) + 273.','20 °C = 293 K.'],'Gas ideal':['Modelo: partículas diminutas y muy separadas, choques elásticos y sin interacción entre choques.','Se cumple bien a baja presión.'],'Boyle-Mariotte':['T constante: P·V = cte; P₁V₁ = P₂V₂ (relación inversa).','Comprimir una jeringa tapada.'],Charles:['P constante: V/T = cte; V₁/T₁ = V₂/T₂ (directa).','Un globo al calentarse.'],'Gay-Lussac':['V constante: P/T = cte; P₁/T₁ = P₂/T₂ (directa).','Un bote cerrado al calentarse.'],Disolución:['Mezcla homogénea de dos o más sustancias en proporción variable.','Agua con sal.'],Soluto:['Sustancia que se disuelve; suele estar en menor proporción.','La sal en el agua salada.'],Disolvente:['Sustancia que disuelve al soluto; suele estar en mayor proporción.','El agua en las disoluciones acuosas.'],Diluida:['Contiene poco soluto disuelto.','Agua con una pizca de sal.'],Concentrada:['Contiene mucho soluto disuelto.','Un café muy cargado.'],Saturada:['Contiene la máxima cantidad de soluto que se disuelve a esa temperatura.','Si añades más, queda sin disolver.'],Concentración:['Relación entre la cantidad de soluto y la de disolución: %m, %V o g/L.','Vinagre al 3 % en masa.']};
const cards=n=>n.map(k=>`<div class=fc tabindex=0 role=button onclick="this.classList.toggle('f')" onkeydown="if(event.key==='Enter')this.classList.toggle('f')"><div class=fi><div class=fa><b>?</b><small>Pulsa para descubrir</small></div><div class=fb><b>${k}</b><br>${CD[k][0]}<br><i>Ej.: ${CD[k][1]}</i></div></div></div>`).join('');
const L=[
[{t:'El estado gaseoso',x:'Un gas se describe con tres magnitudes:<table><tr><th>Magnitud</th><th>SI</th><th>Otras</th></tr><tr><td>Presión P</td><td>Pa</td><td>atm</td></tr><tr><td>Volumen V</td><td>m³</td><td>L (1 L = 1000 mL)</td></tr><tr><td>Temperatura T</td><td>K</td><td>°C</td></tr></table><p class=big>T(K) = t(°C) + 273</p>Ejemplo: 20 °C → 293 K.',c:['Presión','Volumen','Temperatura']},
{t:'Teoría cinética de los gases',x:'Modelo de gas ideal: partículas muy separadas que se mueven continuamente en todas direcciones y en línea recta entre choques. Los choques son elásticos (se conserva la energía cinética). Se desprecian su tamaño y su interacción.<p>Los choques contra las paredes originan la <b>presión</b>. A más temperatura, mayor energía cinética y rapidez media. El gas ocupa todo el recipiente y se comprime porque hay mucho espacio vacío.</p>',c:['Gas ideal']}],
[{t:'Ley de Boyle-Mariotte',x:'<b>Condiciones:</b> temperatura constante y misma cantidad de gas. P y V son inversamente proporcionales: si V disminuye, P aumenta.<p class=big>P₁·V₁ = P₂·V₂</p>Misma unidad de presión y de volumen en los dos estados.',c:['Boyle-Mariotte']},
{t:'Ley de Gay-Lussac',x:'<b>Condiciones:</b> volumen constante y misma cantidad de gas. P es directamente proporcional a T: si T sube, P sube.<p class=big>P₁/T₁ = P₂/T₂</p>Temperatura siempre en kelvin.',c:['Gay-Lussac']},
{t:'Ley de Charles',x:'<b>Condiciones:</b> presión constante y misma cantidad de gas. V es directamente proporcional a T: si T sube, V aumenta.<p class=big>V₁/T₁ = V₂/T₂</p>Temperatura siempre en kelvin.',c:['Charles']},
{t:'Resumen',x:'<table><tr><th>Ley</th><th>Constante</th><th>Fórmula</th></tr><tr><td>Boyle-Mariotte</td><td>T</td><td>P₁V₁ = P₂V₂</td></tr><tr><td>Gay-Lussac</td><td>V</td><td>P₁/T₁ = P₂/T₂</td></tr><tr><td>Charles</td><td>P</td><td>V₁/T₁ = V₂/T₂</td></tr></table><p>Recuerda: T en kelvin y la misma unidad en los dos estados.</p>'}],
[{t:'Ecuación de los gases ideales',x:'<p class=big>P·V = n·R·T</p>P en atm · V en L · n en mol · T en K · R = 0,082 atm·L/(mol·K).<p>Despejes: n = PV/(RT) · V = nRT/P · P = nRT/V · T = PV/(nR)</p>',c:['Gas ideal']},
{t:'Método',x:'1. Escribe los datos. 2. Convierte: mL → L (÷1000) y °C → K (+273). 3. Despeja la incógnita. 4. Sustituye con unidades. 5. Calcula y escribe la unidad. Si T sale en K y piden °C, resta 273.'}],
[{t:'¿Qué es una disolución?',x:'Mezcla <b>homogénea</b> de dos o más sustancias en proporción variable; no distinguimos sus componentes. El <b>soluto</b> se disuelve (suele estar en menor proporción) y el <b>disolvente</b> lo disuelve (mayor proporción). En las disoluciones acuosas, el disolvente es el agua.',c:['Disolución','Soluto','Disolvente']},
{t:'Según la cantidad de soluto',x:'<b>Diluida</b>: poco soluto. <b>Concentrada</b>: mucho soluto. <b>Saturada</b>: la máxima cantidad que se disuelve a esa temperatura; si añadimos más, queda sin disolver.',c:['Diluida','Concentrada','Saturada']}],
[{t:'La concentración',x:'Relaciona la cantidad de soluto con la cantidad de disolución.<p class=big>%m = m soluto / m disolución × 100</p><p class=big>%V = V soluto / V disolución × 100</p><p class=big>c = m soluto / V disolución (g/L)</p>',c:['Concentración']},
{t:'Cuidado con…',x:'En %m y %V, misma unidad arriba y abajo. La masa de la disolución = soluto + disolvente (no solo el agua). Para g/L, el volumen en litros: 1 L = 1000 mL = 1000 cm³.'}],
[{t:'Cómo resolver problemas',x:'Identifica la ley (¿qué magnitud es constante?). Convierte unidades. Escribe la ley, despeja, sustituye y razona el resultado. Errores típicos: usar °C en vez de K, mezclar mL y L, usar solo la masa del disolvente como masa de la disolución.'}],
[{t:'Gran desafío final',x:'Mezcla de todas las misiones. En Practica elige RETO RÁPIDO (6), NORMAL (12) o COMPLETO (20).'}]];
const B0=[MC('¿Cuál es la unidad de presión en el SI?','Pascal (Pa)',['Atmósfera','Litro','Kelvin'],'La atmósfera también se usa, pero la unidad SI es el pascal.',0,'Gases'),
MC('¿Cuánto son 27 °C en kelvin?','300 K',['246 K','27 K','373 K'],'T(K) = 27 + 273 = 300 K.',0,'Gases'),
MC('La presión de un gas se debe a…','los choques de las partículas contra las paredes',['el peso del gas','la atracción entre partículas','su color'],'Más choques o más intensos, más presión.',0,'Gases'),
MC('En el modelo de gas ideal los choques son…','elásticos',['inelásticos','imposibles'],'Se conserva la energía cinética total.',0,'Gases'),
MC('Al aumentar la temperatura de un gas, la rapidez media de sus partículas…','aumenta',['disminuye','no cambia'],'Más temperatura, más energía cinética media.',0,'Gases'),
MC('Un gas se puede comprimir porque…','hay mucho espacio vacío entre sus partículas',['las partículas se aplastan','las partículas desaparecen'],'Las partículas están muy separadas.',0,'Gases'),
TF('Entre choques, las partículas de un gas se mueven en línea recta.',1,'Así es en el modelo de gas ideal.','Gases'),
TF('En el modelo de gas ideal se tiene en cuenta el tamaño de las partículas.',0,'Se desprecian su tamaño y su interacción.','Gases'),
MC('1 L equivale a…','1000 mL',['100 mL','10 mL','10 000 mL'],'1 L = 1000 mL.',0,'Gases')];
const B3=[MC('Una disolución es una mezcla…','homogénea de dos o más sustancias',['heterogénea','de una sola sustancia'],'No distinguimos sus componentes.',0,'Disoluciones'),
MC('En azúcar disuelto en agua, el soluto es…','el azúcar',['el agua','la mezcla'],'El soluto es lo que se disuelve.',0,'Disoluciones'),
MC('En las disoluciones acuosas, el disolvente es…','el agua',['la sal','el soluto'],'El agua es el disolvente.',0,'Disoluciones'),
MC('Una disolución diluida…','contiene poco soluto disuelto',['contiene mucho soluto','no tiene soluto'],'Diluida: poco soluto.',0,'Disoluciones'),
MC('Una disolución saturada…','contiene la máxima cantidad de soluto que se disuelve a esa temperatura',['no tiene soluto','tiene poco soluto'],'Es el límite de disolución.',0,'Disoluciones'),
MC('Añadimos más soluto a una disolución saturada. ¿Qué ocurre?','Queda sin disolver en el fondo',['Se disuelve todo','Desaparece'],'Ya no admite más soluto.',0,'Disoluciones'),
MC('El vinagre es ácido acético en agua al 3 % en masa. El disolvente es…','el agua',['el ácido acético','el vinagre'],'El soluto es el ácido acético.',0,'Disoluciones'),
TF('Una disolución saturada nunca podrá disolver más soluto, cambien las condiciones que cambien.',0,'Puede disolver más si cambian las condiciones, como la temperatura.','Disoluciones'),
MC('Una disolución al 15 % en volumen contiene…','15 mL de soluto por cada 100 mL de disolución',['15 g de soluto por litro','15 mL de agua por 100 mL'],'%V es mL de soluto en 100 mL de disolución.',0,'Disoluciones'),
MC('Una concentración de 20 g/L significa…','20 g de soluto en cada litro de disolución',['20 g de disolvente en un litro','20 L de soluto'],'g/L = masa de soluto por litro de disolución.',0,'Disoluciones')];
const B5=[MC('Un alumno usa °C directamente en la ley de Charles. ¿Qué error comete?','Debe usar kelvin',['Debe usar litros','No hay error'],'Con °C la proporción no es válida y puede salir un volumen negativo.',0,'Gases'),
MC('Un recipiente rígido se calienta. ¿Por qué aumenta la presión?','Los choques son más frecuentes e intensos',['Las partículas se hacen mayores','El volumen aumenta'],'Gay-Lussac: V constante, más T, más P.',0,'Gases'),
MC('Al expandir un gas a T constante, la presión baja porque…','las partículas chocan menos veces con las paredes',['cada partícula es más pequeña','las partículas pierden fuerza'],'Boyle-Mariotte: más espacio, menos choques por unidad de superficie.',0,'Gases'),
MC('Un globo se encoge en la nevera. ¿Qué ley?','Charles',['Boyle-Mariotte','Gay-Lussac'],'P constante: baja T, baja V.',0,'Gases'),
MC('Una bombona cerrada se calienta. ¿Qué ley?','Gay-Lussac',['Boyle-Mariotte','Charles'],'V constante: sube T, sube P.',0,'Gases'),
MC('¿Qué magnitud es constante en la ley de Boyle-Mariotte?','La temperatura',['La presión','El volumen'],'Relaciona P y V.',0,'Gases'),
MC('Para el % en masa, la masa de la disolución es…','soluto + disolvente',['solo el disolvente','solo el soluto'],'La masa total incluye ambos.',0,'Disoluciones'),
MC('Antes de usar PV = nRT con V = 6560 mL, hay que…','pasarlo a litros',['pasarlo a m³','dejarlo en mL'],'R se da con litros: 6,56 L.',0,'Gases'),
MC('Si una disolución se queda con soluto en el fondo aunque agitemos, está…','saturada',['diluida','concentrada'],'Ha llegado al límite de soluto.',0,'Disoluciones')];
const N=(q,num,u,e,tag,h)=>({q,num,u,e,tag,h:h||['Identifica la ley o la fórmula y qué magnitud es constante.','Convierte a kelvin y a litros si hace falta.','Escribe la fórmula, despeja y sustituye.']});
const gB=()=>{const P1=pick([1,1.5,2,3]),V1=pick([4,6,8,12]),V2=pick([2,3,4,6].filter(x=>x!=V1)),P2=P1*V1/V2;return N(`Un gas ocupa ${V1} L a ${fmt(P1)} atm. A temperatura constante pasa a ocupar ${V2} L. Calcula la presión final.`,P2,'atm',`Boyle-Mariotte: P₂ = P₁·V₁ / V₂ = ${fmt(P1)}·${V1} / ${V2} = ${fmt(P2)} atm`,'Gases')};
const gB2=()=>{const P1=pick([1,1.5,2,3]),f=pick([2,3,4]),V1=pick([300,600,900,1200]),V2=V1*f/1000;return N(`Un gas ocupa ${V1} mL a ${fmt(P1)} atm. A temperatura constante la presión baja hasta ${fmt(P1/f)} atm. Calcula el volumen final en litros.`,V2,'L',`V₂ = P₁·V₁ / P₂ = ${fmt(P1)}·${V1} / ${fmt(P1/f)} = ${V1*f} mL = ${fmt(V2)} L`,'Gases')};
const TP={27:[102,177,-48,327],127:[227,327,-73,27],17:[87,127,-83,227],47:[127,167,-47,227]};
const gC=()=>{const t1=pick([27,127]),t2=pick(TP[t1]),V1=pick([2,3,4,6]),V2=V1*(t2+273)/(t1+273);return N(`Un globo contiene ${V1} L de gas a ${t1} °C. A presión constante se lleva a ${t2} °C. Calcula el volumen final.`,V2,'L',`Charles: T₁ = ${t1+273} K, T₂ = ${t2+273} K; V₂ = V₁·T₂/T₁ = ${V1}·${t2+273} / ${t1+273} = ${fmt(V2)} L`,'Gases')};
const gG=()=>{const t1=pick([17,27,47]),t2=pick(TP[t1]),P1=pick([1,1.5,2,2.5]),P2=P1*(t2+273)/(t1+273);return N(`Un recipiente rígido contiene gas a ${fmt(P1)} atm y ${t1} °C. Se calienta hasta ${t2} °C. Calcula la presión final.`,P2,'atm',`Gay-Lussac: T₁ = ${t1+273} K, T₂ = ${t2+273} K; P₂ = P₁·T₂/T₁ = ${fmt(P1)}·${t2+273} / ${t1+273} = ${fmt(P2)} atm`,'Gases')};
const gT=()=>{const T1=pick([300,400]),V1=pick([3,4,6]),V2=pick([4.5,6,8]),T2=T1*V2/V1;return N(`A presión constante, un gas ocupa ${V1} L a ${T1} K. ¿A qué temperatura, en °C, ocupará ${fmt(V2)} L?`,T2-273,'°C',`Charles: T₂ = T₁·V₂/V₁ = ${T1}·${fmt(V2)} / ${V1} = ${fmt(T2)} K = ${fmt(T2-273)} °C`,'Gases')};
const gCo=()=>{const P1=pick([1,2]),V1=pick([3,4,6]),P2=pick([1.5,2,3]),t2=pick([127,227,-73]),V2=P1*V1*(t2+273)/(300*P2);return N(`Un gas ocupa ${V1} L a ${P1} atm y 27 °C. Pasa a ${fmt(P2)} atm y ${t2} °C. Calcula su nuevo volumen.`,V2,'L',`P₁V₁/T₁ = P₂V₂/T₂ → V₂ = ${P1}·${V1}·${t2+273} / (300·${fmt(P2)}) = ${fmt(V2)} L`,'Gases')};
const VT=[[4.92,27],[8.2,127],[6.56,127],[9.84,27]];
const gI1=()=>{const[V,t]=pick(VT),P=pick([1,1.5,2,3]),n=P*V/(.082*(t+273));return N(`Un recipiente de ${V} L contiene un gas ideal a ${fmt(P)} atm y ${t} °C. Calcula la cantidad de gas en moles.`,n,'mol',`T = ${t+273} K; n = PV/(RT) = ${fmt(P)}·${V} / (0,082·${t+273}) = ${fmt(n)} mol`,'Gases')};
const gI2=()=>{const[V,t]=pick(VT),n=pick([.2,.3,.5]),P=n*.082*(t+273)/V;return N(`${fmt(n)} mol de gas ideal ocupan ${V} L a ${t} °C. Calcula su presión en atm.`,P,'atm',`P = nRT/V = ${fmt(n)}·0,082·${t+273} / ${V} = ${fmt(P)} atm`,'Gases')};
const gI3=()=>{const t=pick([27,127]),n=pick([.25,.5]),P=pick([1.5,2,3]),V=n*.082*(t+273)/P*1000;return N(`${fmt(n)} mol de gas ideal están a ${fmt(P)} atm y ${t} °C. Calcula su volumen en mL.`,V,'mL',`V = nRT/P = ${fmt(n)}·0,082·${t+273} / ${fmt(P)} = ${fmt(V/1000)} L = ${fmt(V)} mL`,'Gases')};
const gK=()=>{const t=pick([-23,0,17,27,47,87,127]);return Math.random()<.5?N(`Expresa ${t} °C en kelvin.`,t+273,'K',`T(K) = ${t} + 273 = ${t+273} K`,'Gases',['Suma 273.','T(K) = t(°C) + 273.','Suma 273 al valor en °C.']):N(`Expresa ${t+273} K en °C.`,t,'°C',`t(°C) = ${t+273} − 273 = ${t} °C`,'Gases',['Resta 273.','t(°C) = T(K) − 273.','Resta 273 al valor en K.'])};
const dC=()=>{const m=pick([6,12,15,18,24,30]),V=pick([150,200,250,300,400,500,600]),c=m*1000/V;return N(`Se disuelven ${m} g de sal hasta obtener ${V} mL de disolución. Calcula su concentración en g/L.`,c,'g/L',`V = ${V/1000} L; c = ${m} / ${V/1000} = ${fmt(c)} g/L`,'Disoluciones')};
